<!DOCTYPE html>
<html>
<head>
    <title>Book Registration & Order Form</title>
</head>

<body>

<h1>Book Registration & Order Form</h1>

<form>

    <label>Customer Name:</label>
    <input type="text" name="Shakshi" placeholder="Enter your name" required>
    <br><br>

    <label>Email Address:</label>
    <input type="email" name="shakshi89@gmail.com" placeholder="Enter your email" required>
    <br><br>

    <label>Mobile Number:</label>
    <input type="tel" name="8765438090" placeholder="Enter mobile number" required>
    <br><br>

    <label>Age:</label>
    <input type="number" name="20" placeholder="Enter your age">
    <br><br>

    <label>Password:</label>
    <input type="password" name="sh@kshi88" placeholder="Enter password" required>
    <br><br>

    <label>Delivery Date:</label>
    <input type="date" name="25-10-2026">
    <br><br>

    <label>Preferred Delivery Time:</label>
    <input type="time" name="11:00am">
    <br><br>

    <label>Favorite Book Category:</label>
    <select name="fiction" required>
        <option value="">Select a category</option>
        <option value="fiction">Fiction</option>
        <option value="science">Science</option>
        <option value="history">History</option>
        <option value="children">Children's Books</option>
    </select>
    <br><br>

    <label>Book Title:</label>
    <input type="text" name="The Alchemist" placeholder="Enter book title">
    <br><br>

    <label>Quantity:</label>
    <input type="number" name="1" min="1" value="1">
    <br><br>

    <p>Preferred Payment Method:</p>

    <input type="radio" name="cash on delivery" value="cash">
    <label>Cash on Delivery</label>

    <input type="radio" name="online payment" value="online">
    <label>Online Payment</label>

    <br><br>

    <p>Additional Services:</p>

    <input type="checkbox" name=gift Wrapping">
    <label>Gift Wrapping</label>
    <br>

    <input type="checkbox" name="Bookmark">
    <label>Bookmark</label>
    <br>

    <input type="checkbox" name="Express delivery">
    <label>Express Delivery</label>
    <br>

    <input type="checkbox" name="Greeting card">
    <label>Greeting Card</label>

    <br><br>

    <label>Delivery Address:</label>
    <br>
    <textarea name="36, DC colony" rows="5" cols="40"
              placeholder="Enter your delivery address"></textarea>

    <br><br>

    <label>Special Instructions:</label>
    <br>
    <textarea name="Please deliver Safely" rows="5" cols="40"
              placeholder="Enter any special instructions"></textarea>

    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>

</body>
</html>
