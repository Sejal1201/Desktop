<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu Table</title>
</head>
<body>
    <table border="12" cellpadding="25" cellspacing="10">
        <tr>
        <th colspan="3">Today's Special Menu</th>
        </tr>
        <tr>
            <th>Category</th>
            <th>Food Item</th>
            <th>Price(₹)</th>
        </tr>
        <tr>
            <th rowspan="3">Starters</th>
            <td>Spring Rolls</td>
            <td>120</td>
            <tr>
            <td>Garlic Bread</td>
            <td>100</td>
            </tr>
            <tr>
                <td>Veg Soup</td>
                <td>80</td>
            </tr>
        </tr>
        <tr>
            <th rowspan="3">Main Course</th>
            <td>Paneer Butter Masala</td>
            <td>180</td>
            <tr>
                <td>Veg Biryani</td>
                <td>150</td>
            </tr>
            <tr>
                <td>Dal Tadka</td>
                <td>120</td>
            </tr>
        </tr>
        <tr>
            <th rowspan="3">Desserts</th>
            <td>Chocolate Cake</td>
            <td>90</td>
            <tr>
                <td>Ice-cream</td>
                <td>70</td>
                <tr>
                    <td>Gulab Jamun</td>
                    <td>60</td>

                </tr>
            </tr>
        </tr>
        <tr>
            <th rowspan="3">Drinks</th>
            <td>Fresh lime Soda</td>
            <td>50</td>
            <tr>
                <td>Cold-Coffee</td>
                <td>80</td>
                <tr>
                    <td>Mango Shake</td>
                    <td>70</td>
                </tr>
            </tr>
        </tr>



    </table>
</body>
</html>
